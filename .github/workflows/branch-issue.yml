name: Main Branch Push Check

on:
  push:
    branches:
      - main
      - environment

permissions:
  contents: read
  issues: write

jobs:
  check-main-pushes:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "Checking main branch"
          exit 1

      - name: Create issue on failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow failed: ${context.workflow}`,
              body: [
                '## Workflow Failure',
                '',
                `**Workflow:** ${context.workflow}`,
                `**Branch:** ${context.ref}`,
                `**Commit:** ${context.sha}`,
                `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The workflow failed. Please check the workflow logs for the error.'
              ].join('\n')
            });
