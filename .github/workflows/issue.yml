name: Workflow Failure Issue

on:
  push:
    branches:
      - main
      - environment

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

  create-issue:
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow Failed - Run #${context.runNumber}`,
              body: `
            ## GitHub Actions Failure

            **Workflow:** ${context.workflow}

            **Run:** #${context.runNumber}

            **Branch:** ${context.ref}

            **Commit:** ${context.sha}

            **Failed Job:** build

            **Job Result:** ${{ needs.build.result }}

            **Workflow Run:**
            https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            ## Failure Details

            The build job failed.

            Please check the workflow run above to identify the failed step and error message.
              `,
              labels: ['workflow-failure']
            });
